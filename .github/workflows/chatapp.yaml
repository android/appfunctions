name: ChatApp

on:
  push:
    branches:
      - main
    paths:
      - 'ChatApp/**'
      - '.github/workflows/chatapp.yaml'
      - '.github/ci-gradle.properties'
  pull_request:
  workflow_dispatch:

concurrency:
  group: chatapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: "Check changes"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_ci: ${{ steps.filter.outputs.run_ci }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(ChatApp/|\.github/workflows/chatapp\.yaml|\.github/ci-gradle\.properties)'; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_ci=false" >> "$GITHUB_OUTPUT"
          fi

  chatapp-build:
    name: "ChatApp build & test"
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Run spotless
        run: ./gradlew spotlessCheck
        working-directory: ChatApp

      - name: Run unit tests
        run: ./gradlew test
        working-directory: ChatApp

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup GMD
        run: |
          ./gradlew :app:pixel7Api37Setup \
          --info \
          -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true \
          -Pandroid.testoptions.manageddevices.emulator.gpu="swiftshader_indirect"
        working-directory: ChatApp

      - name: Run instrumentation tests
        run: |
          ./gradlew :app:pixel7Api37Check \
          -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true \
          -Pandroid.testoptions.manageddevices.emulator.gpu="swiftshader_indirect"
        working-directory: ChatApp

      - name: Upload instrumentation test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chatapp-androidtest-report
          path: ChatApp/app/build/reports/androidTests/

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease
        working-directory: ChatApp

      - name: Upload ChatApp APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chatapp-apks
          path: |
            ChatApp/app/build/outputs/apk/**/*.apk
            ChatApp/wear/build/outputs/apk/**/*.apk
